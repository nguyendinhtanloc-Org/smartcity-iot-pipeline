services:
  postgres:
    image: postgres:15-alpine
    container_name: smartcity-postgres
    environment:
      - POSTGRES_DB=smartcity
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smartcity-pipeline
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=smartcity
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PYTHONUNBUFFERED=1
    command:
      - "python"
      - "main.py"
      - "--config"
      - "config/sources.yaml"
      - "--duration"
      - "1200"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: