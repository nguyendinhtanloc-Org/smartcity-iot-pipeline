# docker-compose.yml — CHỈ chạy Telegraf, kết nối thẳng broker thật dathoc.net.
# (Không cần Mosquitto nữa vì broker thật đã hoạt động trở lại.
#  mosquitto.conf + publisher.py vẫn giữ lại làm phương án dự phòng
#  nếu dathoc.net tắt simulator lần nữa — xem README mục "Phương án dự phòng".)
services:
  telegraf:
    image: telegraf:1.30
    container_name: telegraf-multi-mqtt
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./data:/data
    restart: unless-stopped
