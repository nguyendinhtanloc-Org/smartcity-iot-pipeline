# telegraf.kafka-test.conf
# Copy đè tạm lên telegraf.conf trong lúc test Bước 03 (Kafka/Redpanda outage),
# xong test thì trả lại telegraf.conf gốc.
#
# Giữ nguyên outputs.file (để không mất dữ liệu gốc trong lúc test), THÊM
# outputs.kafka để có 1 output thật sự phụ thuộc mạng/broker khác — đúng cái
# mentor hỏi "Redpanda/Kafka unavailable 5 phút -> dữ liệu đi đâu".

[agent]
  interval = "1s"
  flush_interval = "5s"
  metric_buffer_limit = 100000
  collection_jitter = "0s"

[[inputs.mqtt_consumer]]
  name_override = "iot_raw"
  servers = ["wss://dathoc.net:443/mq"]
  topics = ["v1/C001/+/up/telemetry"]
  username = "test1"
  password = "123456"
  qos = 1
  persistent_session = true
  client_id = "telegraf-khu-cn-a"
  topic_tag = "topic"
  data_format = "value"
  data_type = "string"
  insecure_skip_verify = true
  [inputs.mqtt_consumer.tags]
    khu_cn = "A"
    source_name = "CN_A"

[[inputs.mqtt_consumer]]
  name_override = "iot_raw"
  servers = ["wss://dathoc.net:443/mq"]
  topics = ["v1/C001/+/up/telemetry"]
  username = "test1"
  password = "123456"
  qos = 1
  persistent_session = true
  client_id = "telegraf-khu-cn-b"
  topic_tag = "topic"
  data_format = "value"
  data_type = "string"
  insecure_skip_verify = true
  [inputs.mqtt_consumer.tags]
    khu_cn = "B"
    source_name = "CN_B"

[[inputs.mqtt_consumer]]
  name_override = "iot_raw"
  servers = ["wss://dathoc.net:443/mq"]
  topics = ["v1/C001/+/up/telemetry"]
  username = "test1"
  password = "123456"
  qos = 1
  persistent_session = true
  client_id = "telegraf-khu-cn-c"
  topic_tag = "topic"
  data_format = "value"
  data_type = "string"
  insecure_skip_verify = true
  [inputs.mqtt_consumer.tags]
    khu_cn = "C"
    source_name = "CN_C"

# Output gốc — giữ lại làm "ground truth" để so sánh với những gì Kafka nhận được
[[outputs.file]]
  files = ["/data/unified_events.jsonl"]
  data_format = "json"

# Output mới để test outage — mentor hỏi cụ thể về Kafka/Redpanda
[[outputs.kafka]]
  brokers = ["redpanda:9092"]
  topic = "iot.telemetry.raw"
  data_format = "json"
  # metric_buffer_limit riêng của output này (nếu để trống dùng chung agent-level ở trên):
  # khi Redpanda unavailable, Telegraf giữ metric trong buffer RAM tới khi đầy thì DROP
  # (không có disk-backed queue) -> đây chính là câu trả lời "dữ liệu đi đâu".
