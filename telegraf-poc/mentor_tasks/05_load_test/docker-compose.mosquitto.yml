# Dùng kèm docker-compose.yml gốc:
#   docker compose -f docker-compose.yml -f 05_load_test/docker-compose.mosquitto.yml up -d mosquitto
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto-loadtest
    ports:
      - "1883:1883"
    volumes:
      - ./mentor_tasks/05_load_test/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
