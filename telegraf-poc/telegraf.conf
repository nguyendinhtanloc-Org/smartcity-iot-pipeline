# telegraf.conf
# Nguồn dữ liệu: Mosquitto local (do dathoc.net đã tắt simulator, không
# đổi cấu trúc pipeline: vẫn là 3 input MQTT thật, độc lập, Telegraf tự
# quản lý concurrency, không phải threading.Thread tự viết.

[agent]
  interval = "1s"
  flush_interval = "5s"
  metric_buffer_limit = 100000   # <-- "kiểm soát tốc độ" built-in của tool
  collection_jitter = "0s"

# ================== Khu CN A ==================
[[inputs.mqtt_consumer]]
  name_override = "iot_raw"
  servers = ["tcp://mosquitto:1883"]
  topics = ["local/A/+/telemetry"]
  qos = 0
  topic_tag = "topic"
  data_format = "value"
  data_type = "string"
  [inputs.mqtt_consumer.tags]
    khu_cn = "A"
    source_name = "CN_A"

# ================== Khu CN B ==================
[[inputs.mqtt_consumer]]
  name_override = "iot_raw"
  servers = ["tcp://mosquitto:1883"]
  topics = ["local/B/+/telemetry"]
  qos = 0
  topic_tag = "topic"
  data_format = "value"
  data_type = "string"
  [inputs.mqtt_consumer.tags]
    khu_cn = "B"
    source_name = "CN_B"

# ================== Khu CN C ==================
[[inputs.mqtt_consumer]]
  name_override = "iot_raw"
  servers = ["tcp://mosquitto:1883"]
  topics = ["local/C/+/telemetry"]
  qos = 0
  topic_tag = "topic"
  data_format = "value"
  data_type = "string"
  [inputs.mqtt_consumer.tags]
    khu_cn = "C"
    source_name = "CN_C"

# ================== Output: GỘP cả 3 luồng về 1 nơi ==================
[[outputs.file]]
  files = ["/data/unified_events.jsonl"]
  data_format = "json"
