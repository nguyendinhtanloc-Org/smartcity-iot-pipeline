# telegraf.conf
# Thay thế cho src/ingest.py (SourceWorker + threading.Thread + queue.Queue tự viết)
# Mỗi [[inputs.mqtt_consumer]] = 1 kết nối MQTT độc lập, Telegraf tự quản lý concurrency nội bộ
# (không phải mình tự viết threading.Thread nữa).

[agent]
  interval = "1s"
  flush_interval = "5s"
  metric_buffer_limit = 100000   # <-- đây là cái "kiểm soát tốc độ" built-in của tool
  collection_jitter = "0s"

# ================== Khu CN A ==================
[[inputs.mqtt_consumer]]
  name_override = "iot_raw"
  servers = ["wss://dathoc.net:443/mq"]
  topics = ["v1/C001/+/up/telemetry"]
  username = "test1"
  password = "123456"
  qos = 0
  topic_tag = "topic"          # <-- giữ nguyên full topic MQTT làm tag, để downstream tự suy ra data_type
  data_format = "value"        # <-- KHÔNG parse cấu trúc, giữ nguyên payload gốc dạng string
  data_type = "string"
  insecure_skip_verify = true
  [inputs.mqtt_consumer.tags]
    khu_cn = "A"
    source_name = "CN_A"

# ================== Khu CN B ==================
# LƯU Ý: Broker hiện chỉ có simulator C001 đang chạy data.
# Để demo multi-source, CN_B subscribe cùng C001 nhưng gán khu_cn=B (mỗi luồng vẫn là 1 connection MQTT riêng).
# Trong production, mỗi khu CN sẽ có broker/topic riêng (C002, C003).
[[inputs.mqtt_consumer]]
  name_override = "iot_raw"
  servers = ["wss://dathoc.net:443/mq"]
  topics = ["v1/C001/+/up/telemetry"]
  username = "test1"
  password = "123456"
  qos = 0
  topic_tag = "topic"
  data_format = "value"
  data_type = "string"
  insecure_skip_verify = true
  [inputs.mqtt_consumer.tags]
    khu_cn = "B"
    source_name = "CN_B"

# ================== Khu CN C ==================
# Demo: subscribe C001 nhưng gán khu_cn=C (connection MQTT riêng).
[[inputs.mqtt_consumer]]
  name_override = "iot_raw"
  servers = ["wss://dathoc.net:443/mq"]
  topics = ["v1/C001/+/up/telemetry"]
  username = "test1"
  password = "123456"
  qos = 0
  topic_tag = "topic"
  data_format = "value"
  data_type = "string"
  insecure_skip_verify = true
  [inputs.mqtt_consumer.tags]
    khu_cn = "C"
    source_name = "CN_C"

# ================== Output: GỘP cả 3 luồng về 1 nơi ==================
[[outputs.file]]
  files = ["/data/unified_events.jsonl"]
  data_format = "json"
